<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nico • GFX — Reviews</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
 <header>
  <div class="wrap nav">
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <span>Nico • GFX</span>
      <!-- Login/status area -->
      <span id="userArea" style="margin-left:20px"></span>
    </div>
    <nav style="display:flex;gap:10px">
      <a class="btn" href="index.html">Home</a>
      <a class="btn" href="gallery.html">Gallery</a>
      <a class="btn" href="commissions.html">Commissions</a>
      <a class="btn" href="tos.html">TOS</a>
      <a class="btn primary" href="contact.html">Contact</a>
    </nav>
  </div>
</header>

  <main>
    <section class="section">
      <div class="wrap">
        <div class="panel fade-in" style="padding:16px">
          <h2>Client reviews</h2>
          <p class="small">Reviews are saved in Firestore and tied to your account name.</p>

          <div class="card" id="reviewsList"></div>

          <div class="card" style="margin-top:14px">
            <h3>Leave a review</h3>
            <div class="review-form">
              <label for="reviewMsg">Your review</label>
              <textarea id="reviewMsg" rows="4" placeholder="Tell me what you think"></textarea>
              <button id="submitReview" class="btn-xl primary" style="margin-top:10px">Submit review</button>
            </div>
            <p class="note">Tip: Screenshot your commissioned render and include context in your message for others to see.</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap"><p>© <span id="y"></span> Nico • GFX</p></div>
  </footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD0vxLt9Lp_aY74FysXTvCSPrzehweZ_r8",
      authDomain: "nico-s-gfx-page.firebaseapp.com",
      projectId: "nico-s-gfx-page",
      storageBucket: "nico-s-gfx-page.appspot.com",
      messagingSenderId: "427573612616",
      appId: "1:427573612616:web:9ba5b99f191a154cb6887d",
      measurementId: "G-DJJ66RY3ST"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    document.getElementById('y').textContent = new Date().getFullYear();
    const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible') }), {threshold:.15});
    document.querySelectorAll('.fade-in').forEach(el => io.observe(el));

    const msgEl = document.getElementById('reviewMsg');
    const submitBtn = document.getElementById('submitReview');
    const listEl = document.getElementById('reviewsList');
    const provider = new GoogleAuthProvider();

    // Add login button if not logged in
    onAuthStateChanged(auth, user => {
      if (!user) {
        const loginBtn = document.createElement('a');
        loginBtn.textContent = 'Login with Google';
        loginBtn.className = 'btn-xl secondary';
        loginBtn.onclick = () => signInWithPopup(auth, provider);
        document.querySelector('.panel').prepend(loginBtn);
      }
    });

    async function getCommunityName(uid, fallback) {
      const snap = await getDoc(doc(db, "users", uid));
      return snap.exists() ? snap.data().displayName : fallback;
    }

    // Submit review
    submitBtn.addEventListener('click', async () => {
      const user = auth.currentUser;
      if (!user) return alert("Please log in first");

      const text = msgEl.value.trim();
      if (!text) return;

      const name = await getCommunityName(user.uid, user.displayName || "User");

      await addDoc(collection(db, "reviews"), {
        text,
        user: name,
        uid: user.uid,
        timestamp: serverTimestamp()
      });

      msgEl.value = '';
    });

    // Show reviews in real time
    onSnapshot(collection(db, "reviews"), snapshot => {
      listEl.innerHTML = '';
      snapshot.forEach(docSnap => {
        const r = docSnap.data();
        const ts = r.timestamp?.seconds ? new Date(r.timestamp.seconds * 1000) : new Date();
        listEl.innerHTML += `
          <div class="card" style="margin-bottom:10px">
            <div class="small"><strong>${r.user}</strong> • ${ts.toLocaleString()}</div>
            <div style="margin-top:8px">${r.text}</div>
          </div>
        `;
      });
    });
  </script>
<script type="module" src="auth.js"></script>
</body>
</html>
