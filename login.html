<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nico • GFX — Login</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0f0f0f;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .login-card {
      background: #1a1a1a;
      padding: 32px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
      animation: fadeIn .4s ease;
    }

    .login-card h1 {
      margin-bottom: 12px;
      color: white;
      font-size: 26px;
    }

    .login-card p {
      color: #ccc;
      font-size: 14px;
      margin-bottom: 24px;
    }

    .google-btn {
      background: white;
      color: #333;
      padding: 12px 18px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.2s;
    }

    .google-btn:hover {
      background: #e6e6e6;
    }

    .google-btn img {
      width: 20px;
      height: 20px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="login-card">
    <h1>Welcome back</h1>
    <p>Sign in to continue to Nico • GFX</p>

    <div id="loginBtn" class="google-btn">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg">
      Sign in with Google
    </div>
  </div>

  <!-- Firebase + Auth scripts -->
  <script type="module" src="firebase.js"></script>
  <script type="module" src="auth.js"></script>

</body>
</html>
