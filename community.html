<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nico • GFX — Community (Hidden)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <section class="section">
      <div class="wrap">
        <div class="panel fade-in">
          <h2>Community Board</h2>
          <p class="small">Post your services, share images, and chat. This page is hidden — bookmark it.</p>

          <!-- Post form -->
          <div class="card">
            <label for="service">Service</label>
            <input id="service" type="text" placeholder="Describe your service">
            <label for="message">Message</label>
            <textarea id="message" rows="3" placeholder="Say something..."></textarea>
            <label for="image">Upload image</label>
            <input id="image" type="file" accept="image/*">
            <a id="submitPost" class="btn-xl primary" style="margin-top:10px">Post</a>
          </div>

          <!-- Posts list -->
          <div id="postsList" class="section"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap"><p>© <span id="y"></span> Nico • GFX</p></div>
  </footer>

  <!-- Firebase + your scripts -->
  <script type="module">
    // Import Firebase modules from CDN
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-analytics.js";

    // Your Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyD0vxLt9Lp_aY74FysXTvCSPrzehweZ_r8",
      authDomain: "nico-s-gfx-page.firebaseapp.com",
      projectId: "nico-s-gfx-page",
      storageBucket: "nico-s-gfx-page.appspot.com",
      messagingSenderId: "427573612616",
      appId: "1:427573612616:web:9ba5b99f191a154cb6887d",
      measurementId: "G-DJJ66RY3ST"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);

    // Footer year + fade-in
    document.getElementById('y').textContent = new Date().getFullYear();
    const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible') }), {threshold:.15});
    document.querySelectorAll('.fade-in').forEach(el => io.observe(el));

    // Community board storage (localStorage for now)
    const KEY = 'nico_gfx_posts';
    const listEl = document.getElementById('postsList');
    const submitBtn = document.getElementById('submitPost');
    const serviceEl = document.getElementById('service');
    const msgEl = document.getElementById('message');
    const imgEl = document.getElementById('image');

    const load = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch { return []; } };
    const save = items => localStorage.setItem(KEY, JSON.stringify(items));

    function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

    function render() {
      const items = load();
      if (!items.length) {
        listEl.innerHTML = '<div class="card"><p class="small">No posts yet. Be the first!</p></div>';
        return;
      }
      listEl.innerHTML = items.map(p => `
        <div class="card" style="margin-bottom:10px">
          <h3>${esc(p.service)}</h3>
          <p class="small">${esc(p.msg)}</p>
          ${p.img ? `<img src="${p.img}" alt="Post image">` : ''}
          <div class="small">${new Date(p.date).toLocaleString()}</div>
        </div>
      `).join('');
    }

    submitBtn.addEventListener('click', () => {
      const service = serviceEl.value.trim();
      const msg = msgEl.value.trim();
      if (!service || !msg) return;

      const file = imgEl.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          const items = load();
          items.unshift({ service, msg, img: reader.result, date: Date.now() });
          save(items);
          serviceEl.value = ''; msgEl.value = ''; imgEl.value = '';
          render();
        };
        reader.readAsDataURL(file);
      } else {
        const items = load();
        items.unshift({ service, msg, img: null, date: Date.now() });
        save(items);
        serviceEl.value = ''; msgEl.value = '';
        render();
      }
    });

    render();
  </script>
</body>
</html>
