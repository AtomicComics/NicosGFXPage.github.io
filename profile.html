<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nico • GFX — Profile</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <section class="section">
      <div class="wrap">
        <div class="panel fade-in">
          <h2>Your Profile</h2>
          <p id="loginStatus"></p>

          <label for="bio">Bio</label>
          <textarea id="bio" rows="3" placeholder="Write something about yourself..."></textarea>

          <label for="avatar">Avatar</label>
          <input id="avatar" type="file" accept="image/*">

          <a id="saveProfile" class="btn-xl primary">Save Profile</a>
        </div>

        <!-- Profile Preview -->
        <div class="profile-card">
          <img id="avatarPreview" src="" alt="Avatar" width="120">
          <h3 id="usernameDisplay"></h3>
          <p id="bioDisplay"></p>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="profile.js"></script>
</body>
</html>
