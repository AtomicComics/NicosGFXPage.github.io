<!-- gallery.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nico • GFX — Gallery</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-left">
    <img src="Images/nico-gfx-logo.png" alt="Logo">
    <span class="sitename">Nico • GFX</span>
  </div>

  <!-- CENTER NAV LINKS (VISIBLE EVERYWHERE) -->
  <nav class="topbar-nav">
    <a href="index.html" class="topbar-link" id="navHome">Home</a>
    <a href="gallery.html" class="topbar-link" id="navGallery">Gallery</a>
    <a href="commissions.html" class="topbar-link" id="navCommissions">Commissions</a>
    <a href="community.html" class="topbar-link" id="navCommunity">Community</a>
    <a href="reviews.html" class="topbar-link" id="navReviews">Reviews</a>
    <a href="tos.html" class="topbar-link" id="navTos">TOS</a>
    <a href="contact.html" class="topbar-link" id="navContact">Contact</a>
  </nav>

  <div class="topbar-right">
    <!-- Status select -->
    <select id="statusSelect" class="status-dropdown">
      <option value="online">Online</option>
      <option value="dnd">Do Not Disturb</option>
      <option value="offline">Offline</option>
    </select>

    <!-- Avatar + name + status dot + dropdown -->
    <div class="avatar-menu-wrapper">
      <div id="avatarToggle" class="topbar-avatar-btn">
        <img id="topbarAvatar" class="topbar-avatar" src="https://via.placeholder.com/128">
        <span id="topbarName" class="topbar-username">Loading...</span>
        <span id="topbarStatusDot" class="status-dot status-offline"></span>
      </div>

      <!-- Dropdown menu opened by clicking avatar -->
      <div id="avatarMenu" class="avatar-menu">
        <div class="avatar-menu-item" id="menuProfile">Profile</div>
        <div class="avatar-menu-item" id="menuCommunity">Community</div>
        <div class="avatar-menu-item" id="menuSettings">Settings</div>
        <div class="avatar-menu-item" id="menuLogout">Logout</div>
      </div>
    </div>
  </div>
</header>



  <main>
    <section class="section">
      <div class="wrap">
        <div class="panel fade-in" style="padding:16px">
          <h2>Image gallery</h2>
          <p class="small">Add more images by simply adding new img tags to the grid below.</p>
          <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px">
            <!-- Big slots to match your render sizes (16:9 by default) -->
            <!-- Add/remove images freely -->
            <img class="hover-pop" src="/Images/IMG-20250730-WA0000.jpg" alt="Render 1" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="/Images/IMG-20250730-WA0001.jpg" alt="Render 2" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="/Images/IMG-20250731-WA0006.jpg" alt="Render 3" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="/Images/IMG-20250803-WA0013.jpg" alt="Render 4" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="/Images/IMG-20250803-WA0014.jpg" alt="Render 5" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="/ImagesIMG-20250803-WA0014.jpg" alt="Render 6" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="Images/IMG-20250803-WA0015.jpg" alt="Render 7" style=aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="Images/IMG-20250807-WA0001.jpg" alt="Render 8" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="Images/IMG-20250809-WA0018.jpg" alt="Render 9" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="Images/IMG-20250809-WA0019.jpg" alt="Render 10" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="Images/RobloxScreenShot20250807_230246009.png" alt="Render 11" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="Images/RobloxScreenShot20250809_105224265.png" alt="Render 12" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="Images/RobloxScreenShot20251102_091111903.png" alt="Render 13" style="aspect-ratio:16/9;object-fit:cover">
            <img class="hover-pop" src="Images/RobloxScreenShot20251115_183243612.png" alt="Render 14" style="aspect-ratio:16/9;object-fit:cover">

            <img class="hover-pop" src="Images/RobloxScreenShot20251224_142030041.png" alt="Render 25" style="aspect-ratio:16/9;object-fit:cover">
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap"><p>© <span id="y"></span> Nico • GFX</p></div>
  </footer>

  <script>
    document.getElementById('y').textContent = new Date().getFullYear();
    const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible') }), {threshold:.15});
    document.querySelectorAll('.fade-in').forEach(el => io.observe(el));
  </script>
<script type="module" src="firebase.js"></script> 
<script type="module" src="auth.js"></script> 
<script type="module" src="profile.js"></script>
<script type="module" src="topbar.js"></script>
</body>
</html>
