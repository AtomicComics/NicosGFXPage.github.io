<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nico • GFX — Community (Hidden)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <section class="section">
      <div class="wrap">
        <div class="panel fade-in">
          <h2>Community Board</h2>
          <p class="small">Post your services, share images, and chat. This page is hidden — bookmark it.</p>

          <!-- Post form -->
          <div class="card">
            <label for="service">Service</label>
            <input id="service" type="text" placeholder="Describe your service">
            <label for="message">Message</label>
            <textarea id="message" rows="3" placeholder="Say something..."></textarea>
            <label for="image">Upload image</label>
            <input id="image" type="file" accept="image/*">
            <a id="submitPost" class="btn-xl primary" style="margin-top:10px">Post</a>
          </div>

          <!-- Posts list -->
          <div id="postsList" class="section"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap"><p>© <span id="y"></span> Nico • GFX</p></div>
  </footer>

  <!-- Firebase + your scr<script type="module">
  // Import Firebase modules from CDN
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
  import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

  // Your Firebase config
  const firebaseConfig = {
    apiKey: "AIzaSyD0vxLt9Lp_aY74FysXTvCSPrzehweZ_r8",
    authDomain: "nico-s-gfx-page.firebaseapp.com",
    projectId: "nico-s-gfx-page",
    storageBucket: "nico-s-gfx-page.appspot.com",
    messagingSenderId: "427573612616",
    appId: "1:427573612616:web:9ba5b99f191a154cb6887d",
    measurementId: "G-DJJ66RY3ST"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // Login button
  const loginBtn = document.createElement('a');
  loginBtn.textContent = 'Login with Google';
  loginBtn.className = 'btn-xl secondary';
  loginBtn.style.marginBottom = '20px';
  document.querySelector('.panel').prepend(loginBtn);

  const provider = new GoogleAuthProvider();
  loginBtn.addEventListener('click', () => {
    signInWithPopup(auth, provider).then(result => {
      alert(`Welcome ${result.user.displayName}`);
    }).catch(err => console.error(err));
  });

  // Post form logic
  const serviceEl = document.getElementById('service');
  const msgEl = document.getElementById('message');
  const imgEl = document.getElementById('image');
  const submitBtn = document.getElementById('submitPost');
  const listEl = document.getElementById('postsList');

  submitBtn.addEventListener('click', async () => {
    const user = auth.currentUser;
    if (!user) return alert('Please log in first');

    const service = serviceEl.value.trim();
    const msg = msgEl.value.trim();
    if (!service || !msg) return;

    let imgData = null;
    const file = imgEl.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = async () => {
        imgData = reader.result;
        await addDoc(collection(db, "posts"), {
          service,
          msg,
          img: imgData,
          user: user.displayName,
          uid: user.uid,
          timestamp: serverTimestamp()
        });
        serviceEl.value = ''; msgEl.value = ''; imgEl.value = '';
      };
      reader.readAsDataURL(file);
    } else {
      await addDoc(collection(db, "posts"), {
        service,
        msg,
        img: null,
        user: user.displayName,
        uid: user.uid,
        timestamp: serverTimestamp()
      });
      serviceEl.value = ''; msgEl.value = '';
    }
  });

  // Render posts
  onSnapshot(collection(db, "posts"), snapshot => {
    listEl.innerHTML = '';
    snapshot.forEach(doc => {
      const p = doc.data();
      listEl.innerHTML += `
        <div class="card" style="margin-bottom:10px">
          <h3>${p.service}</h3>
          <p class="small">${p.msg}</p>
          ${p.img ? `<img src="${p.img}" alt="Post image">` : ''}
          <div class="small">${new Date(p.timestamp?.seconds * 1000).toLocaleString()}</div>
          <div class="small">Posted by ${p.user}</div>
        </div>
      `;
    });
  });

  // Footer year + fade-in
  document.getElementById('y').textContent = new Date().getFullYear();
  const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible') }), {threshold:.15});
  document.querySelectorAll('.fade-in').forEach(el => io.observe(el));
</script>
</body>
</html>
